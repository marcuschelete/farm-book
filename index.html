<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Book</title>
<meta name="theme-color" content="#2E6A4E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first ledger. Header, one scrolling column, bottom tab bar, bottom sheets for entry forms. */
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --fg:#1C2B22; --muted:#5E6B62; --line:#DDE3D8; --soft:#E7ECE2;
  --accent:#2E6A4E; --accent-fg:#FFFFFF;
  --good:#2E7D4F; --goodbg:#DDEEE3; --warn:#9A5C10; --warnbg:#F6E8D2; --bad:#B23A30; --badbg:#F5DAD6;
  --display:'Bricolage Grotesque','Source Sans 3',system-ui,sans-serif;
  --body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101713; --surface:#18221C; --fg:#E6EDE7; --muted:#9AA89E; --line:#2A372E; --soft:#1F2B24;
  --accent:#6FBF94; --accent-fg:#0E1A13;
  --good:#6FBF94; --goodbg:#1D3426; --warn:#E2A24A; --warnbg:#3A2E18; --bad:#EE8176; --badbg:#3F1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101713; --surface:#18221C; --fg:#E6EDE7; --muted:#9AA89E; --line:#2A372E; --soft:#1F2B24;
  --accent:#6FBF94; --accent-fg:#0E1A13;
  --good:#6FBF94; --goodbg:#1D3426; --warn:#E2A24A; --warnbg:#3A2E18; --bad:#EE8176; --badbg:#3F1F1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.top small{color:var(--muted);display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
.row>*{min-width:0}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font:700 1.75rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.875rem;text-transform:uppercase;letter-spacing:.06em}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left}
.item:first-child{border-top:0}
button.item{cursor:pointer}
.item .main{min-width:0;flex:1}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--goodbg);color:var(--good)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.btn{font:600 .95rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.85rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:5px 12px;font:600 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bar{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}
.bar .track{background:var(--soft);border-radius:5px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.nav div{display:flex;width:100%;max-width:720px}
.nav button{flex:1;background:none;border:0;color:var(--muted);font:600 .8rem var(--body);padding:8px 2px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
label.f small{font-weight:400;color:var(--muted)}
input,select,textarea{font:400 1rem var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px;font-weight:600;font-size:.9rem}
.empty{color:var(--muted);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-weight:600;max-width:90%;text-align:center}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:160px;font-size:.75rem;margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum3 .tile{padding:8px 10px;min-width:0}
.sum3 .tile b{font-size:1.05rem;overflow-wrap:anywhere}
.sum3 .tile span{font-size:.7rem;letter-spacing:.04em}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar b{font:700 1.1rem var(--display)}
.monthbar .btn{min-width:44px;font-size:1.2rem;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;padding:2px 0}
.day{position:relative;min-height:54px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;cursor:pointer;min-width:0}
.day .dn{font-size:.85rem;font-weight:600}
.day .da{font-size:.68rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.day .da.neg{color:var(--bad)}.day .da.pos{color:var(--good)}
.day.today{border-color:var(--accent);border-width:2px}
.day.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.day.sel .da{color:inherit}
.dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:block;position:absolute;top:4px;right:4px}
.day.sel .dot{background:var(--accent-fg)}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rm{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.rm .row{width:100%}
/* ---- charts and analytics ---- */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}
.pie{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.donut{width:100%;max-width:220px;align-self:center;display:block}
.donut text{fill:var(--muted);font:600 9px var(--body)}
.donut text.big{fill:var(--fg);font:700 15px var(--display)}
.slice{cursor:pointer;outline:none}
.slice:hover,.slice:focus-visible{stroke-opacity:.8}
.legend{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--line);color:var(--fg);font:inherit;padding:8px 2px;cursor:pointer;text-align:left;width:100%;min-width:0}
.lrow:first-child{border-top:0}
.lrow .ln{flex:1;min-width:0;overflow-wrap:anywhere}
.lrow .lp{color:var(--muted);min-width:3.2em;text-align:right;font-size:.875rem}
.lrow.off{opacity:.45}
.lrow.off .ln{text-decoration:line-through}
.lrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.sw.inl{margin-right:8px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:4px}
.hbt{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.hbt span:first-child{overflow-wrap:anywhere;min-width:0}
.hb .track{background:var(--soft);border-radius:5px;height:10px}
.hb .track i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}
.chartwrap{position:relative}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .xhair{stroke:var(--muted);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--soft);opacity:.5}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:3;white-space:nowrap}
.tip .tk{display:flex;gap:8px;align-items:center}
.tip .tk i{display:inline-block;width:14px;border-top:2px solid}
.keys{display:flex;gap:12px;font-size:.85rem;color:var(--muted)}
.keys .sw{margin-right:4px;vertical-align:-1px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
table.t thead th{border-top:0;color:var(--muted);font-weight:600;font-size:.8rem;white-space:nowrap}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line)}
table.t .r{text-align:right}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover{background:var(--soft)}
.sh,.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
.sh{font-weight:600}
.lnk{font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.sh:focus-visible,.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.pick input{width:auto;min-height:0;margin:0}
.pick:has(input:checked){background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fl{font-weight:600;font-size:.9rem}.fl small{font-weight:400;color:var(--muted)}
.nav .brand{display:none}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.dash>.s4{grid-column:span 4}.dash>.s5{grid-column:span 5}.dash>.s6{grid-column:span 6}.dash>.s7{grid-column:span 7}.dash>.s8{grid-column:span 8}.dash>.s12{grid-column:span 12}
.dash>*>.card{height:100%}
@media (min-width:900px){
  body.wide{padding-left:196px;padding-right:24px;padding-block:20px 40px}
  body.wide .wrap{max-width:1180px;gap:18px}
  body.wide .narrow{max-width:720px;display:flex;flex-direction:column;gap:16px}
  body.wide .nav{top:0;right:auto;bottom:0;width:172px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:18px 10px}
  body.wide .nav #nav{flex-direction:column;max-width:none;gap:4px}
  body.wide .nav .brand{display:block;font:700 1.25rem var(--display);padding:4px 10px 16px;color:var(--accent);flex:none}
  body.wide .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;font-size:.95rem}
  body.wide .scrim{align-items:center}
  body.wide .sheet{max-width:560px;border-radius:16px;max-height:88%}
  body.wide .toast{bottom:28px}
  .pie{flex-direction:row;align-items:center}
  .pie .donut{width:190px;max-width:190px;flex:none;align-self:center}
  .pie .legend{flex:1;min-width:0}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheetHost"></div>
<nav class="nav" aria-label="Sections"><div id="nav"></div></nav>

<script>
(function(){
'use strict';
var KEY='farmbook.v1';
var SPECIES=['Cattle','Goats','Sheep','Chickens','Other'];
var TYPES=['Vaccine','Dewormer','Dip / tick','Spray','Medicine'];
var OUTCATS=['Feed','Health','Animals','Equipment','Labour','Other'];
var INCATS=['Animal sales','Eggs','Milk','Other'];
var EVT={bought:'Bought',born:'Born',existing:'Already on the farm',sold:'Sold',eaten:'Eaten at home',died:'Died'};
var FREQ={monthly:'Every month',fortnightly:'Every 2 weeks',weekly:'Every week'};
var SRC={born:'born here',bought:'bought',existing:'on the farm'};
var SPCOL={Cattle:'--s1',Goats:'--s2',Sheep:'--s3',Chickens:'--s4',Other:'--s5','':'--muted'};
var NEEDSP=['Animal sales','Eggs','Milk'];
var POPR={'3m':91,'1y':365,'all':0};
var SORT={animals:{k:'tag',d:1},tx:{k:'date',d:-1}};
var splitShared=false,popRange='1y',popHide={};
var db, tab='home', cur=null, flt='All', showPast=false, period='month', confirmKey=null, calMonth='', calDay='';

function p2(n){return (n<10?'0':'')+n}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function toUTC(s){var a=s.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=new Date(toUTC(s)+n*864e5);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())}
function diff(a,b){return Math.round((toUTC(b)-toUTC(a))/864e5)}
function ymd(y,m,d){return y+'-'+p2(m)+'-'+p2(d)}
function dim(y,m){return new Date(y,m,0).getDate()}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return 'P '+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})}
function cmp(n){var a=Math.abs(n);return a>=10000?Math.round(a/1000)+'k':a>=1000?(Math.round(a/100)/10)+'k':String(Math.round(a))}
function dshort(s){if(!s)return '';var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];var a=s.split('-');return +a[2]+' '+m[+a[1]-1]+(a[0]!==today().slice(0,4)?' '+a[0]:'')}
function dlong(s){return new Date(toUTC(s)).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}
function ageStr(b){if(!b)return '';var d=diff(b,today());if(d<0)return '';if(d<60)return d+' d';var m=Math.floor(d/30.44);return m<24?m+' mo':Math.floor(m/12)+' y '+(m%12)+' mo'}
function E(s){return {err:s}}

/* ---------- storage ---------- */
function blank(){return {v:2,example:false,created:today(),lastBackup:'',animals:[],products:[],schedules:[],treatments:[],stock:[],tx:[],recurring:[]}}
function fix(o){
  o.created=o.created||today();o.lastBackup=o.lastBackup||'';
  ['products','schedules','treatments','stock','tx','recurring'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[]});
  o.animals.forEach(function(a){
    if(!a.kind)a.kind=(a.qty===1&&a.tag)?'individual':'group';
    if(a.kind==='individual'){a.qty=1;a.motherId=a.motherId||'';a.fatherId=a.fatherId||'';if(!a.sex||a.sex==='Mixed')a.sex='Unknown'}
  });
  var pn=function(id){var p=o.products.filter(function(x){return x.id===id})[0];return p?p.name:''};
  o.treatments.forEach(function(t){
    if(!t.txId&&t.cost){var m=o.tx.filter(function(y){return y.dir==='out'&&y.cat==='Health'&&y.amount===t.cost&&y.date===t.date&&y.item===pn(t.productId)})[0];if(m)t.txId=m.id}
  });
  var byTx={};o.treatments.forEach(function(t){if(t.txId)byTx[t.txId]=t});
  o.tx.forEach(function(x){
    if(x.dir==='in'&&x.cat==='Sales')x.cat='Animal sales';
    if(!Array.isArray(x.animalIds))x.animalIds=[];
    if(typeof x.species!=='string'){
      var sp='',t=byTx[x.id];
      if(t&&t.target&&t.target!=='All')sp=t.target;
      if(!sp&&(x.dir==='in'||x.cat==='Animals'||x.cat==='Feed'||x.cat==='Health'))sp=guessSpecies((x.item||'')+' '+(x.note||''));
      x.species=sp;
    }
  });
  o.recurring.forEach(function(r){if(typeof r.species!=='string')r.species='';if(!Array.isArray(r.animalIds))r.animalIds=[]});
  return o;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.animals)return fix(o)}}catch(e){}
  return seed();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function save(){persist();if(typeof cloudDirty==='function')cloudDirty()}

function seed(){

/* family helpers */
function relatedMsg(m,f){
  if(!m||!f)return '';
  var mp=[m.motherId,m.fatherId].filter(Boolean), fp=[f.motherId,f.fatherId].filter(Boolean);
  if(mp.indexOf(f.id)>=0||fp.indexOf(m.id)>=0)return 'One of these two is the parent of the other.';
  for(var i=0;i<mp.length;i++){if(fp.indexOf(mp[i])>=0)return 'These two share a parent, so they are brother and sister.'}
  return '';
}
function isDescendant(p,a){
  var seen={},stack=[p];
  while(stack.length){
    var x=stack.pop();if(!x||seen[x.id])continue;seen[x.id]=1;
    var par=[aById(x.motherId),aById(x.fatherId)];
    for(var i=0;i<par.length;i++){if(par[i]){if(par[i].id===a.id)return true;stack.push(par[i])}}
  }
  return false;
}
function parentChoices(species,sex,selfAnimal,sel){
  var l=db.animals.filter(function(a){return isInd(a)&&a.species===species&&a.sex===sex&&(!selfAnimal||(a.id!==selfAnimal.id&&!isDescendant(a,selfAnimal)))});
  l.sort(function(x,y){return ((x.status==='active')?0:1)-((y.status==='active')?0:1)||String(x.tag).localeCompare(String(y.tag))});
  return '<option value="">Not recorded</option>'+l.map(function(a){return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.tag)+(a.status!=='active'?' ('+a.status+')':'')+'</option>'}).join('');
}

  var sp=form.elements.species.value, self=form.dataset.self?aById(form.dataset.self):null;
  var m=form.elements.mother.value, f=form.elements.father.value;
  form.elements.mother.innerHTML=parentChoices(sp,'Female',self,m);
  form.elements.father.innerHTML=parentChoices(sp,'Male',self,f);
  var box=form.querySelector('.relwarn');
  if(box){var msg=relatedMsg(aById(form.elements.mother.value),aById(form.elements.father.value));box.hidden=!msg;box.textContent=msg?msg+' Breeding close relatives can weaken the young.':''}
}

/* repeating costs */
function occ(r,k){
  if(r.freq==='weekly')return addDays(r.start,7*k);
  if(r.freq==='fortnightly')return addDays(r.start,14*k);
  var a=r.start.split('-'),y=+a[0],m=+a[1]-1+k;
  y+=Math.floor(m/12);m=((m%12)+12)%12;
  return ymd(y,m+1,Math.min(r.dom||+a[2],dim(y,m+1)));
}
function nextOcc(r){for(var k=0;k<3000;k++){var d=occ(r,k);if(!r.lastGen||d>r.lastGen)return d}return r.start}
function skipToNow(r){var t=today(),last=null;for(var k=0;k<3000;k++){var d=occ(r,k);if(d>t)break;last=d}if(last&&(!r.lastGen||last>r.lastGen))r.lastGen=last}
function runRecurring(){
  var n=0,t=today();
  db.recurring.forEach(function(r){
    if(!r.active)return;
    for(var k=0;k<3000;k++){
      var d=occ(r,k);if(d>t)break;
      if(r.lastGen&&d<=r.lastGen)continue;
      var dup=db.tx.some(function(x){return x.recId===r.id&&x.date===d});
      r.lastGen=d;
      if(dup)continue;
      db.tx.push({id:uid(),date:d,dir:'out',cat:r.cat,amount:r.amount,item:r.item,supplier:r.supplier||'',note:'',recId:r.id,species:r.species||'',animalIds:(r.animalIds||[]).slice()});n++;
    }
  });
  if(n)save();
  return n;
}

function niceMax(n){
  if(!(n>0))return 1;
  var p=Math.pow(10,Math.floor(Math.log(n)/Math.LN10)),m=n/p,steps=[1,1.2,1.5,2,2.5,3,4,5,6,8,10],f=10;
  for(var i=0;i<steps.length;i++){if(m<=steps[i]+1e-9){f=steps[i];break}}
  return Math.max(1,Math.ceil(f*p-1e-9));
}

/* animal numbers over time */
var EVD={bought:1,born:1,existing:1,sold:-1,eaten:-1,died:-1};
var popGeo=null;
function popData(){
  var t=today(),days=POPR[popRange];
  var evs=db.stock.filter(function(e){return EVD[e.type]!==undefined&&e.date<=t});
  var dates=evs.map(function(e){return e.date}).sort();
  var rs=days?addDays(t,-days):(dates.length?dates[0]:addDays(t,-30));
  if(diff(rs,t)<14)rs=addDays(t,-14);
  var series=[];
  SPECIES.forEach(function(sp){
    var se=evs.filter(function(e){return e.species===sp}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
    var cur=count(sp);if(!cur&&!se.length)return;
    var net=se.reduce(function(s,e){return s+EVD[e.type]*e.qty},0),run=Math.max(0,cur-net),v0=run,pts=[];
    se.forEach(function(e){
      run=Math.max(0,run+EVD[e.type]*e.qty);
      if(e.date<=rs){v0=run;return}
      var last=pts[pts.length-1];
      if(last&&last.d===e.date)last.v=run;else pts.push({d:e.date,v:run});
    });
    pts.unshift({d:rs,v:v0});
    var lp=pts[pts.length-1];
    if(lp.d===t)lp.v=cur;else pts.push({d:t,v:cur});
    if(!pts.some(function(p){return p.v>0}))return;
    series.push({sp:sp,pts:pts,start:v0,now:cur});
  });
  return {rs:rs,t:t,series:series};
}
function valueAt(s,d){var v=s.pts[0].v;for(var i=0;i<s.pts.length;i++){if(s.pts[i].d<=d)v=s.pts[i].v;else break}return v}
function popChart(pd,vis){
  var w=isWide(),W=w?620:340,H=w?250:220,L=32,R=12,T=12,B=24;
  var span=Math.max(1,diff(pd.rs,pd.t)),mx=1;
  vis.forEach(function(s){s.pts.forEach(function(p){if(p.v>mx)mx=p.v})});
  var ym=niceMax(mx);
  function X(d){return r1(L+diff(pd.rs,d)/span*(W-L-R))}
  function Y(v){return r1(T+(1-v/ym)*(H-T-B))}
  var g='',ticks=[0];
  if(ym>=4&&ym%2===0)ticks.push(ym/2);
  ticks.push(ym);
  ticks.forEach(function(v){g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+v+'</text>'});
  var mid=addDays(pd.rs,Math.round(span/2));
  g+='<text x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+dshort(pd.rs)+'</text><text x="'+X(mid)+'" y="'+(H-6)+'" text-anchor="middle">'+dshort(mid)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+dshort(pd.t)+'</text>';
  vis.forEach(function(s){
    var d='M'+X(s.pts[0].d)+' '+Y(s.pts[0].v);
    for(var i=1;i<s.pts.length;i++)d+=' H'+X(s.pts[i].d)+' V'+Y(s.pts[i].v);
    g+='<path d="'+d+'" fill="none" style="stroke:var('+spColor(s.sp)+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  vis.forEach(function(s){
    var p=s.pts[s.pts.length-1];
    g+='<circle cx="'+X(p.d)+'" cy="'+Y(p.v)+'" r="4" stroke-width="2" style="fill:var('+spColor(s.sp)+');stroke:var(--surface)"/>';
  });
  popGeo={W:W,L:L,R:R,rs:pd.rs,t:pd.t,series:vis};
  return '<div class="chartwrap"><svg class="chart popsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Animal numbers over time, one line per animal type">'+g+'<line class="xhair" y1="'+T+'" y2="'+(H-B)+'" style="display:none"/></svg><div class="tip" style="display:none"></div></div>';
}
function cPop(){
  var pd=popData(),vis=pd.series.filter(function(s){return !popHide[s.sp]});
  var rng=[['3m','3 months'],['1y','1 year'],['all','All time']];
  var h='<div class="card"><div class="sec"><h2>Animal numbers over time</h2><div class="chips">'+rng.map(function(r){return '<button class="chip" aria-pressed="'+(popRange===r[0])+'" data-a="poprange" data-v="'+r[0]+'">'+r[1]+'</button>'}).join('')+'</div></div>';

function popHover(svg,e){
  var g=popGeo;if(!g)return;
  var r=svg.getBoundingClientRect();if(!r.width)return;
  var vx=(e.clientX-r.left)/r.width*g.W,span=Math.max(1,diff(g.rs,g.t));
  var off=Math.max(0,Math.min(span,Math.round((vx-g.L)/(g.W-g.L-g.R)*span)));
  var d=addDays(g.rs,off),x=g.L+off/span*(g.W-g.L-g.R);
  var wrap=svg.parentNode,xh=svg.querySelector('.xhair'),tip=wrap.querySelector('.tip');
  xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.style.display='';
  tip.innerHTML='<div class="muted">'+dshort(d)+'</div>'+g.series.map(function(s){return '<div class="tk"><i style="border-color:var('+spColor(s.sp)+')"></i><b class="num">'+valueAt(s,d)+'</b><span>'+esc(s.sp)+'</span></div>'}).join('');
  tip.style.display='block';

}

function monthsBack(n){
  var t=today(),y=+t.slice(0,4),m=+t.slice(5,7),out=[];
  for(var i=n-1;i>=0;i--){var mm=m-i,yy=y;while(mm<=0){mm+=12;yy--}out.push(yy+'-'+p2(mm))}
  return out;
}
function barPath(x,y,w,h,r){
  r=Math.min(r,h,w/2);
  return 'M'+x+' '+(y+h)+' V'+(y+r)+' Q'+x+' '+y+' '+(x+r)+' '+y+' H'+(x+w-r)+' Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+' V'+(y+h)+' Z';
}

  var W=620,H=230,L=40,R=8,T=12,B=26,ym=niceMax(mx||1),band=(W-L-R)/12,bw=14,g='';

  var ticks=[0,ym/2,ym];
  ticks.forEach(function(v){g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+cmp(v)+'</text>'});
  ms.forEach(function(m,i){
    var cx=L+band*i+band/2,a=inn[m]||0,b=out[m]||0,mo=+m.slice(5),lab=MN[mo-1]+((i===0||mo===1)?' '+m.slice(2,4):'');
    g+='<g><title>'+MN[mo-1]+' '+m.slice(0,4)+': sales '+money(a)+', spent '+money(b)+'</title><rect class="hit" x="'+r1(cx-band/2)+'" y="'+T+'" width="'+r1(band)+'" height="'+(H-T-B)+'"/>';

/* spending or income slice breakdown */
function fSlice(pre){
  var P=PERIODS[period],txs,tot,h;
  if(pre.k==='exp'){
    txs=periodTx(period).filter(function(x){return x.dir==='out'&&x.cat===pre.v});
    tot=txs.reduce(function(s,x){return s+x.amount},0);
    var all=totals(period).tout;
    var items=groupSum(txs,function(x){return (x.item||'').trim()||'No description'});
    var top=items.slice(0,6).map(function(r){return {label:r.k,v:r.v}}),rest=items.slice(6).reduce(function(s,r){return s+r.v},0);
    if(rest>0)top.push({label:'Other items',v:rest});
    var spp=groupSum(txs,function(x){return x.species||''}).map(function(r){return {key:r.k,label:r.k||'Whole farm (shared)',v:r.v}});
    h=head(esc(pre.v))+'<div class="small muted">'+P+' · '+money(tot)+(all>0?' · '+pct(tot/all)+' of all spending':'')+'</div>';
    if(!txs.length)return h+'<div class="empty">Nothing in this category for this period.</div>';
    h+='<h3>What it was spent on</h3>'+hbars(top,tot)+'<h3>For which animals</h3>'+hbars(spp,tot,function(r){return spColor(r.key)});
    return h;
  }
  var key=pre.v||'';
  txs=periodTx(period).filter(function(x){return x.dir==='in'&&(x.species||'')===key});
  tot=txs.reduce(function(s,x){return s+x.amount},0);
  var allIn=totals(period).tin,pd=profitData(period,splitShared),row=pd.rows.filter(function(r){return r.sp===key})[0];
  h=head(esc(spName(key)))+'<div class="small muted">'+P+(allIn>0&&tot>0?' · '+pct(tot/allIn)+' of all income':'')+'</div>';
  var cost=row?row.cost:0,profit=tot-cost;
  h+='<div class="sum3"><div class="tile"><b class="num">'+money(tot)+'</b><span>Earned</span></div>'+(key?'<div class="tile"><b class="num">'+money(cost)+'</b><span>Costs</span></div><div class="tile"><b class="num" style="color:var(--'+(profit<0?'bad':'good')+')">'+money(profit)+'</b><span>Profit</span></div>':'')+'</div>';
  if(!txs.length)return h+'<div class="empty">No income recorded for this in the period.</div>'+(key?'<div class="small muted">Costs shown are the ones you tagged to '+esc(key.toLowerCase())+'.</div>':'');
  var types=groupSum(txs,function(x){return x.cat}).map(function(r){return {label:r.k,v:r.v}});
  h+='<h3>Where it came from</h3>'+hbars(types,tot);
  var per={},untied=0;
  txs.forEach(function(x){
    var ids=(x.animalIds||[]).filter(function(id){return aById(id)});
    if(!ids.length)untied+=x.amount;else ids.forEach(function(id){per[id]=(per[id]||0)+x.amount/ids.length});
  });
  var arows=Object.keys(per).map(function(id){return {label:aLabel(aById(id)),v:per[id]}}).sort(function(a,b){return b.v-a.v});
  if(arows.length){if(untied>0)arows.push({label:'Not tied to one animal',v:untied});h+='<h3>By animal</h3>'+hbars(arows,tot)}
  if(key&&!splitShared&&pd.sharedAll>0)h+='<div class="small muted">Costs here are only those tagged to '+esc(key.toLowerCase())+'. Shared farm costs ('+money(pd.sharedAll)+') are left out. Use the split option in Profit per animal type to include a share.</div>';
  return h;
}

/* calendar */
function dayStats(ym){
  var m={};
  db.tx.forEach(function(x){if(x.date.slice(0,7)!==ym)return;var s=m[x.date]||(m[x.date]={'in':0,out:0,items:[]});if(x.dir==='in')s['in']+=x.amount;else s.out+=x.amount;s.items.push(x)});
  return m;
}
function dueMap(ym){
  var m={},end=ym+'-31';
  db.schedules.forEach(function(s){
    if(!s.interval||s.interval<1)return;
    var d=s.next;
    for(var k=0;k<400&&d<=end;k++){if(d.slice(0,7)===ym)(m[d]||(m[d]=[])).push(s);d=addDays(d,s.interval)}
  });
  return m;
}
function calBody(){
  var ym=calMonth, y=+ym.slice(0,4), mo=+ym.slice(5,7), st=dayStats(ym), due=dueMap(ym), t=today();
  var tin=0,tout=0;Object.keys(st).forEach(function(k){tin+=st[k]['in'];tout+=st[k].out});
  var net=tin-tout, first=(new Date(y,mo-1,1).getDay()+6)%7, n=dim(y,mo), cells='';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(w){cells+='<span class="wd">'+w+'</span>'});
  for(var i=0;i<first;i++)cells+='<span></span>';
  for(var d=1;d<=n;d++){
    var ds=ymd(y,mo,d), s=st[ds], dn=s?s['in']-s.out:0;
    cells+='<button class="day'+(ds===t?' today':'')+(ds===calDay?' sel':'')+'" data-a="calday" data-d="'+ds+'" aria-label="'+dlong(ds)+(s?', net '+money(dn):'')+'">'+
      '<span class="dn">'+d+'</span>'+(s?'<span class="da '+(dn<0?'neg':dn>0?'pos':'')+'">'+(dn<0?'-':dn>0?'+':'')+cmp(dn)+'</span>':'')+(due[ds]?'<i class="dot"></i>':'')+'</button>';
  }
  var h='<div class="monthbar"><button class="btn sm" data-a="calprev" aria-label="Previous month">&lsaquo;</button><b>'+new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</b><button class="btn sm" data-a="calnext" aria-label="Next month">&rsaquo;</button></div>'+
    '<div class="sum3"><div class="tile"><b class="num">'+money(tout)+'</b><span>Spent</span></div><div class="tile"><b class="num">'+money(tin)+'</b><span>Sales</span></div><div class="tile"><b class="num" style="color:var(--'+(net<0?'bad':'good')+')">'+money(net)+'</b><span>Net</span></div></div>'+
    '<div class="cal">'+cells+'</div><div class="small muted">Each day shows money in minus money out. A dot marks a treatment that is due.</div>';
  if(!calDay||calDay.slice(0,7)!==ym){h+='<div class="empty">Tap a day to see what was spent or sold.</div>'}
  else{
    var sd=st[calDay], dl=due[calDay]||[], nd=sd?sd['in']-sd.out:0;
    h+='<div class="stack"><div class="sec"><h3>'+dlong(calDay)+'</h3>'+(sd?'<b class="num" style="color:var(--'+(nd<0?'bad':'good')+')">'+(nd>0?'+':'')+money(nd)+'</b>':'')+'</div>';
    if(sd)h+=list(sd.items.map(function(x){return '<div class="item"><div class="main"><div class="t">'+esc(x.item||x.cat)+'</div><div class="s">'+esc(x.cat)+(x.species?' · '+esc(x.species):'')+(x.supplier?' · '+esc(x.supplier):'')+(x.recId?' · repeating':'')+'</div></div><b class="num" style="color:var(--'+(x.dir==='in'?'good':'fg')+')">'+(x.dir==='in'?'+':'')+money(x.amount)+'</b></div>'}),'');
    else h+='<div class="empty">Nothing recorded on this day.</div>';
    dl.forEach(function(s){var p=prod(s.productId);h+='<div class="item"><div class="main"><div class="t">Due: '+esc(p?p.name:'?')+' · '+esc(s.target)+'</div><div class="s">'+esc(s.dose||'')+'</div></div><span class="pill warn">Health</span></div>'});
    h+='<button class="btn sm" data-a="caladd" style="align-self:flex-start">Add an entry on this day</button></div>';
  }
  return h;
}
function fCal(){return head('Calendar')+'<div class="stack calBody">'+calBody()+'</div>'}
function renderCal(){var a=document.querySelectorAll('.calBody'),h=calBody();for(var i=0;i<a.length;i++)a[i].innerHTML=h}
function shiftMonth(n){var y=+calMonth.slice(0,4),m=+calMonth.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;calMonth=y+'-'+p2(m+1);calDay=''}

function openSheet(kind,pre){
  cur={kind:kind,pre:pre||{}};

/* ---------- saving ---------- */
function findProduct(name,type,wd){
  var p=db.products.find(function(x){return x.name.toLowerCase()===name.toLowerCase()});
  if(!p){p={id:uid(),name:name,type:type,withdrawal:wd||0};db.products.push(p)}
  else{p.type=type;if(wd!==null)p.withdrawal=wd}
  return p;
}
function removeRow(c,id){
  if(c==='treatments'){
    var t=db.treatments.find(function(x){return x.id===id});
    if(t){linkLegacy(t);if(t.txId)db.tx=db.tx.filter(function(x){return x.id!==t.txId});db.treatments=db.treatments.filter(function(x){return x.id!==id});recalcSchedule(t.productId,t.target)}
    return;
  }
  if(c==='tx'){db.tx=db.tx.filter(function(x){return x.id!==id});db.treatments.forEach(function(t){if(t.txId===id){t.txId='';t.cost=0}});return}
  if(c==='animals'){
    db.animals=db.animals.filter(function(x){return x.id!==id});
    db.animals.forEach(function(a){if(a.motherId===id)a.motherId='';if(a.fatherId===id)a.fatherId=''});
    db.tx.forEach(function(x){x.animalIds=(x.animalIds||[]).filter(function(i){return i!==id})});
    db.recurring.forEach(function(r){r.animalIds=(r.animalIds||[]).filter(function(i){return i!==id})});
    return;
  }
  db[c]=db[c].filter(function(x){return x.id!==id});
}
var forms={
 treat:function(f){
  var name=f.product.trim();if(!name)return E('Enter the product name.');
  var wdv=f.withdrawal===''?null:Math.max(0,+f.withdrawal||0);
  var animalId='',target=f.target;
  if(target.indexOf('an:')===0){animalId=target.slice(3);var an=aById(animalId);target=an?an.species:'All'}
  var p=findProduct(name,f.type,wdv), cost=+f.cost||0, wd=wdv===null?p.withdrawal:wdv;
  if(f._id){
    var t=db.treatments.find(function(x){return x.id===f._id});if(!t)return E('That entry no longer exists.');
    linkLegacy(t);
    var oldP=t.productId,oldT=t.target;
    t.date=f.date;t.productId=p.id;t.target=target;t.animalId=animalId;t.dose=f.dose.trim();t.note=f.note.trim();t.withdrawal=wd;
    syncTreatCost(t,cost,p.name);
    recalcSchedule(oldP,oldT);recalcSchedule(p.id,target);
    return;
  }
  var nt={id:uid(),date:f.date,productId:p.id,target:target,animalId:animalId,dose:f.dose.trim(),cost:0,note:f.note.trim(),withdrawal:wd,txId:''};
  db.treatments.push(nt);
  syncTreatCost(nt,cost,p.name);
  if(!animalId){
    var s=db.schedules.find(function(x){return x.productId===p.id&&x.target===target});
    if(s){s.last=f.date;s.next=addDays(f.date,s.interval);if(f.dose.trim())s.dose=f.dose.trim()}
  }
 },
 sched:function(f){
  if(!(+f.interval>=1))return E('Enter how many days between treatments.');
  var name=f.product.trim();if(!name)return E('Enter the product name.');
  var p=findProduct(name,f.type,f.withdrawal===''?null:Math.max(0,+f.withdrawal||0));
  if(f._id){
    var s0=db.schedules.find(function(x){return x.id===f._id});if(!s0)return E('That schedule no longer exists.');
    s0.productId=p.id;s0.target=f.target;s0.interval=+f.interval;s0.next=f.next;s0.dose=f.dose.trim();
    return;
  }
  var s=db.schedules.find(function(x){return x.productId===p.id&&x.target===f.target});
  if(s){s.interval=+f.interval;s.next=f.next;s.dose=f.dose.trim()}
  else db.schedules.push({id:uid(),productId:p.id,target:f.target,interval:+f.interval,dose:f.dose.trim(),last:null,next:f.next});
 },
 tx:function(f){
  var amt=+f.amount;if(!(amt>0))return E('Enter an amount above 0.');
  var sp=f.species||'',picks=[].concat(f.pick||[]).filter(Boolean).filter(function(id){var a=aById(id);return a&&a.species===sp});
  if(f.dir==='in'&&NEEDSP.indexOf(f.cat)>=0&&!sp)return E('Choose which type of animal this came from.');
  if(!sp)picks=[];
  if(f._id){
    var x=db.tx.find(function(r){return r.id===f._id});if(!x)return E('That entry no longer exists.');
    x.date=f.date;x.dir=f.dir;x.cat=f.cat;x.amount=amt;x.item=f.item.trim();x.supplier=f.supplier.trim();x.species=sp;x.animalIds=picks;
    db.treatments.forEach(function(t){if(t.txId===x.id)t.cost=amt});
    return;
  }
  if(f.dir==='out'&&f.repeat&&f.repeat!=='none'){
    db.recurring.push({id:uid(),dir:'out',cat:f.cat,amount:amt,item:f.item.trim(),supplier:f.supplier.trim(),freq:f.repeat,start:f.date,dom:+f.date.slice(8),lastGen:null,active:true,species:sp,animalIds:picks});
    runRecurring();
    return {msg:'Repeating cost saved: '+FREQ[f.repeat].toLowerCase()+', from '+dshort(f.date)+'.'};
  }
  db.tx.push({id:uid(),date:f.date,dir:f.dir,cat:f.cat,amount:amt,item:f.item.trim(),supplier:f.supplier.trim(),note:'',species:sp,animalIds:picks});
 },
 rec:function(f){
  var r=db.recurring.find(function(x){return x.id===f._id});if(!r)return E('That repeating cost no longer exists.');
  var amt=+f.amount;if(!(amt>0))return E('Enter an amount above 0.');
  r.item=f.item.trim();r.cat=f.cat;r.amount=amt;r.supplier=f.supplier.trim();
  var oldSp=r.species||'';r.species=f.species||'';if(r.species!==oldSp)r.animalIds=[];
  var cur0=nextOcc(r),was=r.active;
  r.active=f.active==='yes';
  if(f.next!==cur0||f.freq!==r.freq){r.freq=f.freq;r.start=f.next;r.dom=+f.next.slice(8);r.lastGen=null}
  else if(r.active&&!was)skipToNow(r);
  runRecurring();
 },
 animalEdit:function(f){
  var a=aById(f._id);if(!a)return E('That animal no longer exists.');
  var ind=isInd(a),tag=f.tag.trim();
  if(ind&&!tag)return E('A tag number is needed.');
  if(tag&&tagTaken(tag,a.id))return E('The tag '+tag+' is already used by another animal.');
  a.tag=tag;a.species=f.species;a.sex=f.sex;a.birth=f.birth||'';a.status=f.status;
  if(ind){
    a.motherId=f.mother||'';a.fatherId=f.father||'';
    var mo=aById(a.motherId),fa=aById(a.fatherId);
    if(mo&&mo.species!==a.species)a.motherId='';
    if(fa&&fa.species!==a.species)a.fatherId='';
  }else a.qty=Math.max(1,parseInt(f.qty,10)||1);
 },
 event:function(f){
  var t=f.type,price=+f.price||0;
  if(t==='bought'||t==='born'||t==='existing'){
    var sp=f.species,q,note=f.note.trim(),newIds=[];
    if(f.kind==='individual'){
      var tags=String(f.tags||'').split(',').map(function(s){return s.trim()}).filter(Boolean);
      if(!tags.length)return E('Enter a tag number for the animal.');
      var seen={};
      for(var i=0;i<tags.length;i++){
        var k=tags[i].toLowerCase();
        if(seen[k])return E('The tag '+tags[i]+' is used twice.');
        seen[k]=1;
        if(tagTaken(tags[i]))return E('The tag '+tags[i]+' is already used by another animal.');
      }
      var withParents=(t==='born'||t==='existing');
      tags.forEach(function(tg){var nid=uid();newIds.push(nid);db.animals.push({id:nid,tag:tg,species:sp,sex:f.sexI,qty:1,source:t,birth:t==='born'?f.date:(f.birthI||''),status:'active',kind:'individual',motherId:withParents?(f.mother||''):'',fatherId:withParents?(f.father||''):''})});
      q=tags.length;if(!note)note=tags.join(', ');
    }else{
      q=Math.max(1,parseInt(f.qtyNew,10)||1);
      db.animals.push({id:uid(),tag:f.tagG.trim(),species:sp,sex:f.sexG,qty:q,source:t,birth:t==='born'?f.date:'',status:'active',kind:'group',motherId:'',fatherId:''});
    }
    db.stock.push({id:uid(),date:f.date,type:t,species:sp,qty:q,who:t==='bought'?(f.who||''):'',price:t==='bought'?price:0,note:note});
    if(t==='bought'&&price>0)db.tx.push({id:uid(),date:f.date,dir:'out',cat:'Animals',amount:price,item:q+' '+sp.toLowerCase(),supplier:f.who||'',note:'',species:sp,animalIds:newIds});
  }else{
    var a=aById(f.animalId);if(!a)return E('Choose an animal first.');
    var q2=isInd(a)?1:Math.max(1,Math.min(a.qty,parseInt(f.qtyOut,10)||1));
    a.qty-=q2;if(a.qty<=0){a.qty=q2;a.status=t}
    db.stock.push({id:uid(),date:f.date,type:t,species:a.species,qty:q2,who:f.who||'',price:t==='sold'?price:0,note:f.note.trim()||(isInd(a)?a.tag:'')});
    if(t==='sold'&&price>0)db.tx.push({id:uid(),date:f.date,dir:'in',cat:'Animal sales',amount:price,item:(isInd(a)?a.tag:q2+' '+a.species.toLowerCase())+' sold',supplier:f.who||'',note:'',species:a.species,animalIds:isInd(a)?[a.id]:[]});
  }
 }
};

var actions={
 tab:function(d){tab=d.v;confirmKey=null;render();window.scrollTo(0,0)},
 open:function(d){openSheet(d.k,{})},
 close:function(){closeSheet()},
 logsched:function(d){openSheet('treat',{sched:d.id})},

 past:function(){showPast=!showPast;render()},

 treatedit:function(d){openSheet('treat',{tid:d.id})},

 rmgo:function(d){removeRow(d.c,d.id);save();closeSheet();render();toast(d.c==='recurring'?'Removed. Entries already added stay.':'Removed.')},
 scrim:function(d,el,e){if(e.target===el)closeSheet()},
 wipe1:function(){confirmKey='wipe';render()},
 cancelc:function(){confirmKey=null;render()},
 wipe2:function(){db=blank();confirmKey=null;save();tab='home';render()},
 export:function(){
  var txt=backupText();
  function fb(){var m=document.getElementById('expMsg');if(m){m.innerHTML='Select and copy:<pre class="code" id="expPre"></pre>';var pre=document.getElementById('expPre');pre.textContent=txt}else toast('Could not copy. Use Save to phone.')}
  try{navigator.clipboard.writeText(txt).then(function(){markBackup();toast('Backup copied. Paste it into a WhatsApp message to yourself.')},fb)}catch(e){fb()}
 },
 download:function(){
  try{downloadText(backupName(),backupText(),'text/plain');markBackup();toast('Saved to your Downloads. Send that file to yourself too.')}catch(e){toast('Saving is not available here. Use Copy as text.')}
 },
 share:function(){
  var txt=backupText(),f=null;
  try{f=new File([txt],backupName(),{type:'text/plain'})}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){

 },
 cgoogle:function(){
  cloudRun('Opening Google sign-in...',function(f){
    var pr=new f.A.GoogleAuthProvider();
    return f.A.signInWithPopup(f.auth,pr).then(function(){return null},function(e){

 },

};

setTimeout(function(){if(cloud.linked)cloudInit().then(function(){cloudAuto()},function(){})},2500);

try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
})();
